# install.sh viewer -> /etc/sysctl.d/90-tsn5g-viewer.conf
# The viewer's UDP sockets take the kernel default receive buffer. Camera
# frames arrive as bursts of ~1400-byte datagrams; at the 208 KB default the
# kernel dropped them before the viewer could read them. 8 MB is what the
# first rig ran with (the same setting fixes the UPF, core/etc/90-tsn-udp.conf).
net.core.rmem_default = 8388608
net.core.rmem_max = 50000000
