# install.sh core -> /etc/sysctl.d/90-tsn-udp.conf
# The UPF's GTP-U socket takes the kernel default receive buffer (it never sets
# SO_RCVBUF). At 208 KB, camera bursts overflowed it and showed up as uplink
# loss that looked like radio loss (LESSONS.md). 8 MB fixed it.
net.core.rmem_default = 8388608
net.core.netdev_max_backlog = 5000
# UHD (X410): large send buffer required, large receive buffer for 100 MHz
net.core.wmem_max = 25000000
net.core.rmem_max = 50000000
# The UE pool is NATed out of the management NIC
net.ipv4.ip_forward = 1
