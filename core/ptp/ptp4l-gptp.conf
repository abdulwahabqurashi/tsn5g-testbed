# gPTP (IEEE 802.1AS) profile for the E810 port on amrctsnserver.
# Matches upf.yaml nwtt.gptp.time_domain_number: 0 (802.1AS uses domain 0).
# Derived from linuxptp's stock gPTP.cfg.
[global]
gmCapable                1
priority1                248
priority2                248
domainNumber             0
logAnnounceInterval      0
logSyncInterval          -3
logMinPdelayReqInterval  0
syncReceiptTimeout       3
neighborPropDelayThresh  800
min_neighbor_prop_delay  -20000000
assume_two_step          1
path_trace_enabled       1
follow_up_info           1
transportSpecific        0x1
ptp_dst_mac              01:80:C2:00:00:0E
network_transport        L2
delay_mechanism          P2P
time_stamping            hardware
tx_timestamp_timeout     10
# This host is a CLIENT of the TSN network's grandmaster.
# To make it the grandmaster instead, lower priority1 (e.g. 128).
slaveOnly                1

[enp37s0f0np0]
