platform: auto
modem:
  wwan_interface: wwan0
  qmi_device: /dev/cdc-wdm0
  dnn: usrptsn
  cid: 1
  baud_rate: 115200
  # The egress queue on wwan0. The Linux default (fq_codel, 10240 packets) is
  # both far deeper than a gate cycle and deliberately flow-fair, so it cancels
  # any priority set upstream. Re-applied on every data call, because the
  # interface loses it when the call is re-established.
  #   shallow — pfifo, the gate decides and this preserves the decision
  #   prio    — strict priority at the bottleneck; the control that answers
  #             "is the gate in the wrong place?"
  #   default — leave the system default, for a baseline run with no policy
  egress_queue:
    policy: shallow
    limit: 20
transport:
  mode: vxlan
vxlan:
  core_ip: 10.45.0.1
  mtu: 1350
  vlan_map:
  - vlan: 60
    vni: 60
    pcp: 7
    dscp: 46
    role: control
  - vlan: 70
    vni: 70
    pcp: 4
    dscp: 34
    role: hp_video
  - vlan: 80
    vni: 80
    pcp: 0
    dscp: 0
    role: be_video
  ptp:
    vni: 88
    dstport: 4792
bridge:
  name: ds-tt-br0
  stp: false
  vlan_filtering: true
  group_fwd_mask: 16384
  ageing_time: 0
tsn_nics: []
gptp:
  enabled: false
tas:
  default_profile: urllc-5qi82
# ---------------------------------------------------------------------------
# Software TSN bridge. Off until the data path is proven — turning it on does
# nothing by itself; the build has to be triggered from the UI or the API.
# ---------------------------------------------------------------------------
tsnbridge:
  enabled: false
  underlay: wwan0
  veth_queues: 8
  modem_qdisc_limit: 20
  fold: shared
  classes:
    # dscp is the OUTER marking, and the only priority the 5G system can act
    # on — the inner 802.1Q tag is payload to the RAN. Values follow the same
    # map as vxlan.vlan_map above: 46 (EF) for control, 0 for best effort.
    # When the third class lands, hp_video takes 34 (AF41).
    - name: ctrl
      vlan: 60
      vni: 606
      dstport: 4789
      identity_map: true
      dscp: 46
      bridge_ip: 10.60.0.2/24
    - name: video
      vlan: 80
      vni: 808
      dstport: 4790
      identity_map: true
      dscp: 0
      bridge_ip: 10.80.0.2/24

speedtest:
  # Where iperf runs are written. The existing runs from iperf5g.sh are
  # here, so history stays continuous.
  log_dir: /home/amrc/camera_application/iperf_logs
  server: 10.45.0.1
  duration: 5
switch:
  host: 192.168.1.1
  user: admin
  ports: 1-8
api:
  enabled: true
  host: 0.0.0.0
  port: 8080
state_file: /var/lib/tsn5g-ue/state.json
log_level: info
