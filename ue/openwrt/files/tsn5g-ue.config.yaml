# TSN-5G UE Console — OpenWRT default config (installed to /etc/tsn5g-ue/tsn5g-ue.yaml).
# Differs from the generic-Linux example only where OpenWRT paths/tools differ.

# Force the OpenWRT provider (UCI / netifd / uqmi / iwinfo / procd).
platform: openwrt

modem:
  wwan_interface: wwan0
  qmi_device: /dev/cdc-wdm0   # uqmi/qmi control device
  dnn: tsn
  cid: 1
  baud_rate: 115200
  # device: /dev/ttyUSB2      # AT port — auto-detected if omitted

transport:
  mode: vxlan                 # ethernet | vxlan

vxlan:
  core_ip: 10.45.0.1
  mtu: 1450
  vlan_map:
    - { vlan: 60, vni: 60, dstport: 4789, pcp: 7, dscp: 46, role: control  }
    - { vlan: 70, vni: 70, dstport: 4790, pcp: 4, dscp: 34, role: hp_video }
    - { vlan: 80, vni: 80, dstport: 4791, pcp: 0, dscp: 0,  role: be_video }
  ptp:
    vni: 88
    dstport: 4792

bridge:
  name: ds-tt-br0
  stp: false
  vlan_filtering: true
  group_fwd_mask: 0x4000
  ageing_time: 0

tsn_nics:
  - interface: eth1
    hw_timestamping: true

gptp:
  enabled: true
  time_domain_number: 0
  transport_specific: 1
  priority1: 255

tas:
  default_profile: urllc-5qi82

switch:
  host: 192.168.1.1
  user: admin
  ports: "1-8"
  default_profile: urllc-5qi82

api:
  enabled: true
  host: 0.0.0.0
  port: 8080

# OpenWRT overlay is small; keep state on the persistent partition.
state_file: /etc/tsn5g-ue/state.json

log_level: info
