<!doctype html>
<html lang="en" data-theme="auto" data-density="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>TSN-5G UE Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Applied before first paint so the kiosk never flashes white on boot.
       Duplicated from ui/tokens.js on purpose: a module is deferred, and by
       the time it runs the wrong background has already been shown. */
    try {
      var r = document.documentElement;
      r.dataset.theme = localStorage.getItem("tsn5g.theme") || "auto";
      r.dataset.density = localStorage.getItem("tsn5g.density") || "desktop";
    } catch (e) { /* private mode */ }
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">5G</div>
        <div>
          <div class="brand-name">TSN-5G UE</div>
          <div class="brand-sub">Console</div>
        </div>
      </div>

      <!-- Generated from app/routes.js. Do not hand-edit. -->
      <nav class="nav" id="nav" aria-label="Main"></nav>

      <div class="sidebar-foot">
        <div class="conn-pill" id="conn-badge" title="connection">
          <span class="dot idle"></span><span>Connecting…</span>
        </div>
        <div class="ver" id="app-version"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Dashboard</h1>
        <div class="topbar-right" id="topbar-controls"></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" hidden onclick="document.getElementById('drawer').hidden=true;this.hidden=true"></div>
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Details</h2>
      <button class="btn ghost" type="button" aria-label="Close"
              onclick="document.getElementById('drawer').hidden=true;document.getElementById('drawer-scrim').hidden=true">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div id="modal-host" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
